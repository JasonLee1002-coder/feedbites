# ============================================================
# 常來點 EatAgain nginx 設定片段（原 Feedbites，basePath 已改 /eatagain）
# 加入到 omnicore-nginx 主設定的 server {} 區塊內
# ============================================================

# 靜態上傳檔案（直接 serve，不走 Next.js）— 新路徑
# 用 ^~ 前綴優先比對，避免被下面 /feedbites/ 的正規表示式 location 蓋掉
location ^~ /eatagain/uploads/ {
    alias /home/jason/feedbites-uploads/;
    expires 30d;
    add_header Cache-Control "public, immutable";
}

# 舊路徑上傳檔案繼續提供（資料庫裡已存的圖片網址是 /feedbites/uploads/...，不改資料）
location ^~ /feedbites/uploads/ {
    alias /home/jason/feedbites-uploads/;
    expires 30d;
    add_header Cache-Control "public, immutable";
}

# 常來點 EatAgain Next.js 應用
location /eatagain/ {
    proxy_pass http://feedbites:3200/eatagain/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;
    proxy_read_timeout 60s;
}

# 舊路徑 301 轉址到新路徑（Jason 2026-09-13：欣殿萬飲的 QR 還沒印，網址一起改；
# 既有連結與已印出的舊 QR 用這個轉址過去）
# 沒有結尾斜線的舊首頁網址（舊 canonical、sitemap、OG url）
location = /feedbites {
    return 301 /eatagain/;
}

location ~ ^/feedbites/(.*)$ {
    return 308 /eatagain/$1$is_args$args;
}
